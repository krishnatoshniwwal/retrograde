name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies (OpenCV)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short --color=yes

      - name: Check module imports
        run: |
          python -c "
          from src.preprocessing import preprocess_array
          from src.contours import get_all_contours
          from src.fourier import dft_pipeline, compute_rms_error
          from src.piecewise import spline_pipeline
          from src.symbolic import fourier_to_latex_lines
          from src.render import plot_reconstruction, plot_poster
          from src.latex_export import build_latex_document
          from src.explainer import explain_reconstruction, explain_epicycles, explain_equations
          print('All imports OK')
          "
